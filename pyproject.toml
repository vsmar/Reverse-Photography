[project]
name = "reverse-photography"
version = "0.1.0"
description = "Reverse dual-photography: structured-light capture and 3D reconstruction with two RealSense cameras and a projector"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pygame",
    "pyrealsense2",
    "scipy",
    "screeninfo",
    "tqdm",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reverse_photography"]
